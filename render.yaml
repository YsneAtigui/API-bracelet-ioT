services:
  - type: web
    name: iot-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_SERVER
        value: "smtp.example.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: "braceletiot00@gmail.com"
      - key: SMTP_PASSWORD
        value: "kmwj fpar nmqc dngh"

databases:
  - name: iot-db
    databaseName: iot_db
    user: iot_user
    plan: free
    postgresMajorVersion: 14
    ipAllowList: []

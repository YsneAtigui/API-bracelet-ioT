services:
  - type: web
    name: iot-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/users/me
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DATABASE_URL
        fromDatabase:
          name: iot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: SMTP_SERVER
        value: "smtp.example.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "user@example.com"
      - key: SMTP_PASSWORD
        value: "your-password"

databases:
  - name: iot-db
    databaseName: iot_db
    user: iot_user
    plan: free
    postgresMajorVersion: 14
    ipAllowList: []
